name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install streamrip dependencies
        working-directory: repo
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set version in package.json
        working-directory: desktop
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Set version in frontend package.json
        working-directory: desktop/frontend
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & package
        working-directory: desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe

  # TODO: macOS builds temporarily disabled — code signing issues
  # Re-enable build-macos-arm64 and build-macos-x64 jobs when fixed

  release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List installers
        run: find installers -type f

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Extract the section for this version from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Get text between this version header and the next version header (or end)
            SECTION=$(awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]")) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md)
          fi

          if [ -n "$SECTION" ]; then
            {
              echo "CHANGELOG<<EOF"
              echo "## What's Changed"
              echo ""
              echo "$SECTION"
              echo "---"
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            # Fallback: generate from git log if CHANGELOG.md has no entry
            PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1 || echo "")
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
              COMMITS=$(git log --pretty=format:"%s" HEAD)
            else
              COMMITS=$(git log --pretty=format:"%s" ${PREV_TAG}..HEAD)
            fi

            # Split commit messages that contain multiple entries (comma-separated feat:/fix:)
            PARSED=""
            while IFS= read -r line; do
              # Remove "release: vX.Y.Z — " prefix if present
              clean=$(echo "$line" | sed 's/^release: v[0-9.]*[[:space:]]*[—–-][[:space:]]*//')
              # Split on ", " and process each part
              echo "$clean" | tr ',' '\n' | while IFS= read -r part; do
                trimmed=$(echo "$part" | sed 's/^[[:space:]]*//')
                if [ -n "$trimmed" ]; then
                  echo "- $trimmed"
                fi
              done
            done <<< "$COMMITS" > /tmp/parsed_commits.txt
            PARSED=$(cat /tmp/parsed_commits.txt)

            FEATURES=$(echo "$PARSED" | grep -i "^- feat" || echo "")
            FIXES=$(echo "$PARSED" | grep -i "^- fix" || echo "")
            OTHER=$(echo "$PARSED" | grep -iv "^- feat\|^- fix" || echo "")

            {
              echo "CHANGELOG<<EOF"
              echo "## What's Changed"
              echo ""
              if [ -n "$FEATURES" ]; then
                echo "### Features"
                echo "$FEATURES"
                echo ""
              fi
              if [ -n "$FIXES" ]; then
                echo "### Bug Fixes"
                echo "$FIXES"
                echo ""
              fi
              if [ -n "$OTHER" ]; then
                echo "### Other"
                echo "$OTHER"
                echo ""
              fi
              echo "---"
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: streamrip-ui ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
          files: |
            installers/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
